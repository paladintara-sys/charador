<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор: Наследие</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap');
        
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --celtic-gold: #d4af37;
        }

        body { 
            background-color: #080707; 
            margin: 0; padding: 0; 
            color: #f5f5f4; 
            font-family: 'Old Standard TT', serif;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Фиксированная область изображения */
        .image-frame {
            height: 40vh;
            width: 100%;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Область контента с прокруткой */
        .content-area {
            height: 60vh;
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(20px + var(--safe-area-inset-bottom));
            background: linear-gradient(to bottom, #0c0a09, #080707);
        }

        .ornament-border {
            position: relative;
            border: 2px solid var(--celtic-gold);
            padding: 24px 16px;
            margin: 12px;
            min-height: calc(100% - 24px);
            background: rgba(18, 14, 12, 0.95);
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1);
            display: flex;
            flex-direction: column;
        }

        .celtic-corner {
            position: absolute;
            width: 35px;
            height: 35px;
            fill: var(--celtic-gold);
            opacity: 0.6;
            pointer-events: none;
        }

        .stat-glow-hp { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
        .stat-glow-mp { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }

        .choice-btn {
            background: linear-gradient(135deg, #1c1917 0%, #0c0a09 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.2s ease;
            width: 100%;
        }

        .choice-btn:active {
            transform: scale(0.97);
            border-color: var(--celtic-gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .hand-drawn-filter {
            filter: contrast(1.05) saturate(1.15) brightness(0.9);
        }

        /* Скрытие полосы прокрутки для чистоты интерфейса */
        .content-area::-webkit-scrollbar {
            display: none;
        }
        .content-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Heart, Sparkles, Volume2, VolumeX, ChevronRight, Skull, ShieldCheck } = {
            Heart: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Sparkles: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L9 9l-8 3 8 3 3 8 3-8 8-3-8-3-3-8z"/></svg>,
            Volume2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            VolumeX: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>,
            ChevronRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>,
            Skull: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 10L9.01 10M15 10L15.01 10M12 2C6.48 2 2 6.48 2 12C2 14.59 3.02 16.94 4.65 18.73L4.65 22L8 22L8 20L16 20L16 22L19.35 22L19.35 18.73C20.98 16.94 22 14.59 22 12C22 6.48 17.52 2 12 2Z"/></svg>,
            ShieldCheck: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        };

        const CelticCorner = ({className}) => (
            <svg viewBox="0 0 100 100" className={className}>
                <path d="M0,0 L100,0 L100,10 L10,10 L10,100 L0,100 Z M30,30 L70,30 L70,40 L40,40 L40,70 L30,70 Z" />
            </svg>
        );

        const { useState, useEffect, useRef } = React;

        // В промптах теперь четко указано: аниме-арт, цифровая живопись, никаких фото.
        const STORY_DATA = [
            {
                id: 'prologue',
                title: "На грани миров",
                text: "Холод Белогорья кусает пальцы. Вы с Бермяшем стоите на развилке. Впереди — Смерги, тени, пожирающие души. Позади — тлеющие угли дома. Флейта Латар в ваших руках дрожит. Нужно решить: потратить магию на защитный купол для двоих или рвануть сквозь тени, рискуя плотью, но сохраняя силы для будущего боя?",
                prompt: "Stunning high-quality digital anime painting, vibrant fantasy colors, cel-shaded style, a small traveler and a loyal companion at a snowy mountain crossroad, glowing purple shadows in background, magical atmosphere, intricate hand-drawn textures, Makoto Shinkai aesthetic",
                options: [
                    { text: "Создать барьер (Защитить Бермяша)", cost: { mp: 35 }, next: 'forest_safe', label: "Магия и Дружба" },
                    { text: "Бежать сквозь мрак (Рискнуть собой ради сил)", cost: { hp: 30 }, next: 'forest_hurt', label: "Жертва и Выживание" }
                ]
            },
            {
                id: 'forest_safe',
                title: "Шепот Древних",
                text: "Барьер мерцает, отражая когти теней. Бермяш благодарен, его взгляд спокоен. Но мана почти на исходе. Впереди — мост, который охраняет Лесной Страж. Он требует плату за проход: либо вы отдадите ему Флейту, либо сразитесь в ослабленном состоянии. Потеря флейты — это потеря цели, но смерть — это конец пути.",
                prompt: "Hand-drawn fantasy anime illustration, 2D art style, a mystical forest bridge with a giant mossy stone guardian, soft magical glow, lush ancient trees, detailed hand-painted textures, Studio Ghibli inspired",
                options: [
                    { text: "Вступить в бой без магии (Честь)", cost: { hp: 45 }, next: 'victory', label: "Отчаяние" },
                    { text: "Отдать Флейту (Предать цель ради жизни)", cost: { mp: 0, hp: 0 }, next: 'lost_path', label: "Трусость" },
                    { text: "Попробовать обмануть Стража (Хитрость)", cost: { mp: 20 }, next: 'failure', label: "Риск" }
                ]
            }
        ];

        const App = () => {
            const [scene, setScene] = useState('intro');
            const [step, setStep] = useState(0);
            const [stats, setStats] = useState({ hp: 100, mp: 100 });
            const [image, setImage] = useState(null);
            const [loadingImg, setLoadingImg] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const audioRef = useRef(null);
            const contentRef = useRef(null);
            const AUDIO_FILE = "Slow_Water_Over_Stone.mp3";

            const generateArt = async (prompt) => {
                const apiKey = ""; 
                if (!apiKey) return;
                setLoadingImg(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) { console.error(e); }
                setLoadingImg(false);
            };

            useEffect(() => {
                if (scene === 'playing') {
                    generateArt(STORY_DATA[step].prompt);
                    // Скроллим вверх при переходе на новый шаг
                    if (contentRef.current) contentRef.current.scrollTo(0, 0);
                }
            }, [step, scene]);

            const startPlaying = () => {
                setScene('playing');
                if (audioRef.current) {
                    audioRef.current.play().catch(e => console.log("Audio play blocked", e));
                }
            };

            const handleOption = (opt) => {
                const newHp = Math.max(0, stats.hp - (opt.cost?.hp || 0));
                const newMp = Math.max(0, stats.mp - (opt.cost?.mp || 0));
                setStats({ hp: newHp, mp: newMp });
                
                if (newHp <= 0) setScene('gameover');
                else if (step + 1 < STORY_DATA.length) setStep(step + 1);
                else setScene('victory');
            };

            if (scene === 'intro') return (
                <div className="h-screen bg-[#080707] flex flex-col items-center justify-between p-12 text-center border-4 border-[#d4af37]/20 m-2 rounded-3xl overflow-hidden">
                    <div className="mt-12">
                        <div className="w-24 h-24 mx-auto mb-6 relative">
                            <Sparkles className="w-full h-full text-amber-500 animate-pulse" />
                            <div className="absolute inset-0 bg-amber-500/20 blur-xl rounded-full"></div>
                        </div>
                        <h1 className="text-6xl font-bold tracking-tighter text-amber-50 uppercase mb-4" style={{fontFamily: 'Old Standard TT'}}>Чарадор</h1>
                        <p className="text-amber-600 text-sm uppercase tracking-[0.5em] italic">Наследие Флейты</p>
                    </div>
                    
                    <button onClick={startPlaying} className="w-full py-6 choice-btn rounded-2xl font-bold uppercase tracking-widest text-amber-100 shadow-[0_0_30px_rgba(212,175,55,0.15)] active:scale-95 transition-all">
                        Войти в легенду
                    </button>
                    <audio ref={audioRef} src={AUDIO_FILE} loop />
                </div>
            );

            if (scene === 'gameover') return (
                <div className="h-screen bg-black flex flex-col items-center justify-center p-8 text-center">
                    <Skull className="w-20 h-20 text-red-900 mb-6" />
                    <h2 className="text-4xl font-bold text-red-700 uppercase mb-4 leading-tight">Ваша песнь оборвалась</h2>
                    <p className="text-stone-500 mb-8 italic text-lg">Мир Чарадор поглощен тишиной...</p>
                    <button onClick={() => window.location.reload()} className="px-10 py-4 border border-stone-800 rounded-full text-stone-400 uppercase text-xs tracking-widest">Переродиться</button>
                </div>
            );

            const current = STORY_DATA[step];

            return (
                <div className="game-container">
                    <audio ref={audioRef} src={AUDIO_FILE} loop />
                    
                    <div className="image-frame">
                        {loadingImg ? (
                            <div className="absolute inset-0 flex items-center justify-center bg-stone-950">
                                <div className="flex flex-col items-center gap-4">
                                    <div className="w-10 h-10 border-2 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-amber-900">Пробуждение видения...</span>
                                </div>
                            </div>
                        ) : (
                            <img src={image || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000"} className="w-full h-full object-cover hand-drawn-filter" alt="vision" />
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0c0a09] via-transparent to-black/20" />
                        
                        {/* Stats Bar - компактнее для мобильных */}
                        <div className="absolute top-8 left-4 right-4 flex justify-between items-start z-10">
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center gap-2">
                                    <div className="p-1.5 rounded bg-black/60 border border-red-500/30 stat-glow-hp">
                                        <Heart className="w-3 h-3 text-red-500" />
                                    </div>
                                    <div className="h-1.5 w-20 bg-stone-900 rounded-full border border-white/5 overflow-hidden">
                                        <div className="h-full bg-red-600 transition-all duration-500" style={{width: `${stats.hp}%`}} />
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="p-1.5 rounded bg-black/60 border border-blue-500/30 stat-glow-mp">
                                        <Sparkles className="w-3 h-3 text-blue-500" />
                                    </div>
                                    <div className="h-1.5 w-20 bg-stone-900 rounded-full border border-white/5 overflow-hidden">
                                        <div className="h-full bg-blue-600 transition-all duration-500" style={{width: `${stats.mp}%`}} />
                                    </div>
                                </div>
                            </div>
                            <button onClick={() => { if(audioRef.current) audioRef.current.muted = !isMuted; setIsMuted(!isMuted); }} className="p-2.5 bg-black/60 rounded-lg border border-white/10 backdrop-blur-md">
                                {isMuted ? <VolumeX className="w-4 h-4 text-white" /> : <Volume2 className="w-4 h-4 text-white" />}
                            </button>
                        </div>
                    </div>

                    <div className="content-area" ref={contentRef}>
                        <div className="ornament-border">
                            <CelticCorner className="celtic-corner top-0 left-0" />
                            <CelticCorner className="celtic-corner top-0 right-0 rotate-90" />
                            <CelticCorner className="celtic-corner bottom-0 left-0 -rotate-90" />
                            <CelticCorner className="celtic-corner bottom-0 right-0 rotate-180" />
                            
                            <div className="mb-4 text-center">
                                <span className="text-[10px] text-amber-600 font-bold uppercase tracking-[0.4em]">{current.title}</span>
                            </div>
                            
                            <p className="text-lg leading-relaxed text-stone-200 italic font-serif text-center px-1 mb-8">
                                «{current.text}»
                            </p>

                            <div className="space-y-4 mt-auto">
                                {current.options.map((opt, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => handleOption(opt)}
                                        className="choice-btn p-5 rounded-xl text-left relative overflow-hidden group"
                                    >
                                        <div className="relative z-10">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-[9px] text-amber-700 font-bold uppercase tracking-widest">{opt.label}</span>
                                                <ChevronRight className="w-3 h-3 text-amber-900 group-hover:text-amber-500 transition-colors" />
                                            </div>
                                            <div className="text-amber-50 text-sm group-hover:text-white transition-colors pr-6 leading-snug">{opt.text}</div>
                                            {opt.cost && (
                                                <div className="flex gap-4 mt-2 border-t border-white/5 pt-1">
                                                    {opt.cost.hp > 0 && <span className="text-[9px] text-red-500/80 uppercase font-bold tracking-tighter">Кровь: -{opt.cost.hp}</span>}
                                                    {opt.cost.mp > 0 && <span className="text-[9px] text-blue-500/80 uppercase font-bold tracking-tighter">Дух: -{opt.cost.mp}</span>}
                                                </div>
                                            )}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
