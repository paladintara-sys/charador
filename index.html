<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор: Наследница флейты</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:italic,wght@400;700&display=swap');
        
        body { 
            background-color: #0c0a09; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            color: #e7e5e4; 
            font-family: 'Old Standard TT', serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(15, 12, 10, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
        }

        .status-bar { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .fade-in { animation: fadeIn 2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .img-overlay {
            background: linear-gradient(to bottom, rgba(12,10,9,0) 0%, rgba(12,10,9,0.4) 50%, rgba(12,10,9,1) 100%);
        }

        .option-btn {
            background: linear-gradient(90deg, rgba(20,15,10,0.8) 0%, rgba(40,30,20,0.4) 100%);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Анимация мерцания для магических элементов */
        .magic-glow {
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Heart, Zap, Skull, Shield, Music, Volume2, VolumeX, RefreshCw, Upload, ArrowRight, Loader2, Sparkles, Feather } = {
            Heart: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Zap: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
            Skull: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 10L9.01 10M15 10L15.01 10M12 2C6.48 2 2 6.48 2 12C2 14.59 3 16.94 4.65 18.66L12 22L19.35 18.66C21 16.94 22 14.59 22 12C22 6.48 17.52 2 12 2Z"/></svg>,
            Shield: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Music: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Volume2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            VolumeX: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>,
            RefreshCw: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            Upload: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
            ArrowRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
            Loader2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Sparkles: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707"/></svg>,
            Feather: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg>
        };

        const { useState, useEffect, useRef, useCallback } = React;

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [step, setStep] = useState(0);
            const [health, setHealth] = useState(100);
            const [mana, setMana] = useState(100);
            const [currentImage, setCurrentImage] = useState(null);
            const [loadingImg, setLoadingImg] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            const [audioSrc, setAudioSrc] = useState('1-2 Начало пути. Прощание с домом.mp3'); // Вшитый файл
            const audioRef = useRef(null);
            const fileInputRef = useRef(null);

            const story = [
                {
                    title: "Начало: Врата Чарадора",
                    text: "Туман расступается перед тобой. В руках — древняя флейта, голос которой может оживить камни. Сзади топчется Бермяш, крепко сжимая лямки своего рюкзака. Путь в сердце леса открыт.",
                    prompt: "Masterpiece dark fantasy art, Makoto Shinkai and Ghibli hybrid style, a young girl with a glowing wooden flute and a stout small boy standing before a massive, overgrown gate of a dark magical forest, cinematic sunset lighting, fireflies, mystical atmosphere, 8k resolution",
                    options: [
                        { text: "Сыграть колыбельную лесу", cost: { mana: 10 }, gain: { health: 5 }, next: 1 },
                        { text: "Уверенно войти внутрь", cost: { health: 5 }, next: 1 }
                    ]
                },
                {
                    title: "Шепот Оживших Корней",
                    text: "Черные корни Яха вырываются из-под земли! Они пытаются опутать ноги Бермяша. Лес сопротивляется вашему присутствию.",
                    prompt: "Intense dark fantasy scene, aggressive giant black tree roots attacking two children, tiny girl holding a brightly glowing musical flute, magical aura, dark moody forest, cinematic action shot",
                    options: [
                        { text: "Резонанс: Разрушить путы звуком", cost: { mana: 25 }, next: 2 },
                        { text: "Защитить Бермяша собой", cost: { health: 30 }, next: 2 }
                    ]
                },
                {
                    title: "Озеро Тысячи Слез",
                    text: "Озеро неподвижно. В его глубине мерцают тени прошлого. Говорят, вода забирает голос у того, кто пришел без мелодии в сердце.",
                    prompt: "Breathtaking mystical lake in a dark forest, obsidian water surface, glowing spirits under water, reflection of a starry sky, tiny heroes on a stone pier, ethereal lighting",
                    options: [
                        { text: "Успокоить озеро нежной игрой", cost: { mana: 20 }, gain: { health: 15 }, next: 3 },
                        { text: "Пройти мимо, затаив дыхание", cost: { mana: 5, health: 10 }, next: 3 }
                    ]
                },
                {
                    title: "Алтарь Древних",
                    text: "Массивная каменная плита преграждает путь. На ней высечены знаки, пульсирующие в такт твоему пульсу. Чарадор ждет твоего решения.",
                    prompt: "Grand ancient stone altar in a clearing, blue runic carvings glowing, floating stone fragments, majestic forest background, cinematic wide angle, epic fantasy",
                    options: [
                        { text: "Пробудить руны флейтой", cost: { mana: 40 }, next: 4 },
                        { text: "Принести в жертву немного сил", cost: { health: 25, mana: 10 }, next: 4 }
                    ]
                },
                {
                    title: "Башня Вечной Тени",
                    text: "Вот и она. Обитель Яха. Небо над башней разрывают фиолетовые молнии. Бермяш шепчет: 'Мы почти пришли...'",
                    prompt: "Menacing dark obsidian fortress tower, swirling purple storm clouds, magical lightning, epic final boss atmosphere, tiny heroes in the foreground looking up, dramatic lighting",
                    options: [
                        { text: "ФИНАЛ: Песнь Возрождения!", next: 'check' }
                    ]
                }
            ];

            const generateImage = useCallback(async (promptText) => {
                const apiKey = ""; // API ключ
                if (!apiKey) return;
                setLoadingImg(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt: promptText }, parameters: { sampleCount: 1 } })
                    });
                    const data = await response.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setCurrentImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) {
                    console.error("Image generation failed:", e);
                } finally {
                    setLoadingImg(false);
                }
            }, []);

            useEffect(() => {
                if (gameState === 'playing') {
                    generateImage(story[step].prompt);
                }
            }, [step, gameState]);

            const handleStart = () => {
                setGameState('playing');
                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.play().catch(e => console.log("Autoplay prevented:", e));
                    }
                }, 500);
            };

            const handleOption = (opt) => {
                if (opt.next === 'check') {
                    setGameState(health > 25 ? 'victory' : 'dead');
                    return;
                }
                setHealth(prev => Math.min(100, Math.max(0, prev - (opt.cost?.health || 0) + (opt.gain?.health || 0))));
                setMana(prev => Math.min(100, Math.max(0, prev - (opt.cost?.mana || 0) + (opt.gain?.mana || 0))));
                
                if (health - (opt.cost?.health || 0) <= 0) setGameState('dead');
                else setStep(opt.next);
            };

            const handleManualUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setAudioSrc(url);
                    setTimeout(() => {
                        if (audioRef.current) {
                            audioRef.current.load();
                            audioRef.current.play();
                        }
                    }, 300);
                }
            };

            if (gameState === 'intro') return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-[#0c0a09] p-8 text-center relative">
                    <div className="absolute inset-0 opacity-20 overflow-hidden pointer-events-none">
                         <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-amber-900/30 blur-[120px] rounded-full" />
                         <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full" />
                    </div>
                    
                    <Feather className="w-12 h-12 text-amber-600 mb-6 magic-glow" />
                    <h1 className="text-7xl font-bold tracking-[0.2em] text-amber-50 uppercase mb-2">Чарадор</h1>
                    <p className="text-amber-700 uppercase tracking-[0.5em] mb-16 text-[10px]">Наследница великой флейты</p>
                    
                    <div className="w-full max-w-xs space-y-4 relative z-10">
                        <button onClick={handleStart} className="w-full py-5 bg-amber-600 text-black rounded-full font-bold uppercase tracking-widest hover:bg-amber-400 transition-all shadow-[0_0_30px_rgba(217,119,6,0.3)]">
                            Начать путь
                        </button>
                        <div className="flex items-center gap-2 text-stone-600 py-4">
                            <div className="h-[1px] flex-1 bg-stone-800" />
                            <span className="text-[10px] uppercase">или</span>
                            <div className="h-[1px] flex-1 bg-stone-800" />
                        </div>
                        <button onClick={() => fileInputRef.current.click()} className="w-full py-4 bg-stone-900 border border-stone-800 rounded-full font-bold text-stone-400 uppercase tracking-widest text-[9px] flex items-center justify-center gap-2 hover:border-amber-900 transition-colors">
                            <Upload className="w-3 h-3" /> Своя мелодия
                        </button>
                        <input type="file" ref={fileInputRef} className="hidden" accept="audio/*" onChange={handleManualUpload} />
                    </div>
                    <p className="absolute bottom-12 text-stone-700 text-[9px] uppercase tracking-widest">Музыка: {audioSrc.split('/').pop()}</p>
                </div>
            );

            if (gameState === 'dead') return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-black p-8 text-center">
                    <Skull className="w-24 h-24 text-red-900 mb-8 animate-pulse" />
                    <h2 className="text-5xl font-bold text-red-700 uppercase mb-6 tracking-tight">Музыка смолкла</h2>
                    <p className="text-stone-600 italic mb-12 max-w-md">Твои пальцы задрожали, и последняя нота сорвалась в пустоту. Лес Яха поглотил надежду Чарадора...</p>
                    <button onClick={() => window.location.reload()} className="p-5 px-12 border-2 border-red-950 text-red-900 rounded-full uppercase font-bold text-xs hover:bg-red-950/20 transition-all">Вернуться к началу</button>
                </div>
            );

            if (gameState === 'victory') return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-amber-50 p-8 text-center">
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/paper-fibers.png')] opacity-10" />
                    <Sparkles className="w-24 h-24 text-amber-500 mb-8 animate-bounce" />
                    <h2 className="text-6xl font-bold text-amber-900 uppercase mb-6 tracking-tighter">Свет исцеления</h2>
                    <p className="text-amber-800/70 italic mb-12 max-w-lg text-lg">Твоя финальная песнь разбила оковы тьмы. Чарадор расцвел, а Ях стал лишь легендой, которой пугают непослушных духов.</p>
                    <button onClick={() => window.location.reload()} className="p-5 px-12 bg-amber-900 text-amber-100 rounded-full uppercase font-bold text-xs shadow-2xl hover:scale-105 transition-transform">Оставить след в истории</button>
                </div>
            );

            const scene = story[step];

            return (
                <div className="h-screen w-full flex flex-col relative bg-stone-950 overflow-hidden">
                    {audioSrc && <audio ref={audioRef} src={audioSrc} loop />}
                    
                    {/* Визуализация окружения */}
                    <div className="absolute inset-0 z-0">
                        {loadingImg ? (
                            <div className="w-full h-full flex flex-col items-center justify-center bg-[#0c0a09]">
                                <Loader2 className="w-10 h-10 text-amber-900" />
                                <div className="mt-6 text-[10px] text-amber-900/50 uppercase tracking-[0.4em] animate-pulse">Духи рисуют мир...</div>
                            </div>
                        ) : (
                            <div className="w-full h-full relative">
                                <img 
                                    src={currentImage || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop"} 
                                    className="w-full h-full object-cover fade-in scale-105"
                                    style={{transition: 'transform 10s linear'}}
                                />
                                <div className="absolute inset-0 img-overlay" />
                            </div>
                        )}
                    </div>

                    {/* Панель статуса сверху */}
                    <div className="relative z-20 p-6 pt-12 flex justify-between items-start pointer-events-none">
                        <div className="space-y-3 pointer-events-auto">
                            <div className="flex items-center gap-4 bg-black/60 p-2 px-4 rounded-2xl border border-white/5 backdrop-blur-xl">
                                <Heart className="w-4 h-4 text-red-500" />
                                <div className="w-32 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                    <div className="status-bar h-full bg-red-500 shadow-[0_0_10px_#ef4444]" style={{width: `${health}%`}} />
                                </div>
                            </div>
                            <div className="flex items-center gap-4 bg-black/60 p-2 px-4 rounded-2xl border border-white/5 backdrop-blur-xl">
                                <Zap className="w-4 h-4 text-blue-400" />
                                <div className="w-32 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                    <div className="status-bar h-full bg-blue-400 shadow-[0_0_10px_#60a5fa]" style={{width: `${mana}%`}} />
                                </div>
                            </div>
                        </div>
                        <button 
                            onClick={() => { if(audioRef.current) audioRef.current.muted = !isMuted; setIsMuted(!isMuted); }} 
                            className="pointer-events-auto p-4 bg-black/60 rounded-2xl border border-white/5 backdrop-blur-xl text-amber-500 active:scale-90 transition-transform"
                        >
                            {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                        </button>
                    </div>

                    {/* Текстовый блок и кнопки управления */}
                    <div className="mt-auto p-6 pb-12 space-y-6 max-w-2xl mx-auto w-full relative z-20">
                        <div className="glass-panel p-8 rounded-[2.5rem]">
                            <h3 className="text-[10px] uppercase tracking-[0.5em] text-amber-600 font-bold mb-4 flex items-center gap-3">
                                <span className="h-[1px] w-8 bg-amber-900" /> {scene.title}
                            </h3>
                            <p className="text-xl md:text-2xl leading-relaxed text-amber-50/95 font-serif italic">
                                «{scene.text}»
                            </p>
                        </div>

                        <div className="grid grid-cols-1 gap-3">
                            {scene.options.map((opt, i) => (
                                <button 
                                    key={i} 
                                    onClick={() => handleOption(opt)} 
                                    className="option-btn group w-full p-6 rounded-3xl flex items-center justify-between hover:bg-amber-600/10 active:scale-[0.98] transition-all backdrop-blur-md"
                                >
                                    <div className="text-left">
                                        <div className="text-amber-100 font-medium text-lg group-hover:text-amber-400 transition-colors">{opt.text}</div>
                                        {(opt.cost || opt.gain) && (
                                            <div className="flex gap-4 mt-2 text-[10px] uppercase font-bold tracking-widest opacity-40">
                                                {opt.cost?.mana && <span className="text-blue-400">-{opt.cost.mana} Мана</span>}
                                                {opt.cost?.health && <span className="text-red-400">-{opt.cost.health} ХП</span>}
                                                {opt.gain?.health && <span className="text-green-400">+{opt.gain.health} ХП</span>}
                                                {opt.gain?.mana && <span className="text-blue-300">+{opt.gain.mana} Мана</span>}
                                            </div>
                                        )}
                                    </div>
                                    <div className="p-3 bg-white/5 rounded-full group-hover:bg-amber-600/20 group-hover:text-amber-400 transition-all">
                                        <ArrowRight className="w-5 h-5" />
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
