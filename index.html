<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор: Наследница флейты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:italic,wght@400;700&display=swap');
        
        body { 
            background-color: #0c0a09; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            color: #e7e5e4; 
            font-family: 'Old Standard TT', serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .scene-enter { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-panel {
            background: rgba(15, 12, 10, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .controls-container {
            padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
        }

        .death-screen { background: radial-gradient(circle, #1a0a0a 0%, #000 100%); }
        .victory-screen { background: radial-gradient(circle, #2d2a10 0%, #0c0a09 100%); }

        .status-bar { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Heart, Sparkles, Zap, Skull, Shield, Music, Volume2, VolumeX, RefreshCw, Upload, ArrowRight, Loader2 } = {
            Heart: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Sparkles: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707"/></svg>,
            Zap: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
            Skull: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 10L9.01 10M15 10L15.01 10M12 2C6.48 2 2 6.48 2 12C2 14.59 3 16.94 4.65 18.66L12 22L19.35 18.66C21 16.94 22 14.59 22 12C22 6.48 17.52 2 12 2Z"/></svg>,
            Shield: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Music: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Volume2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            VolumeX: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>,
            RefreshCw: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            Upload: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
            ArrowRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
            Loader2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        };

        const { useState, useEffect, useCallback, useRef } = React;

        const App = () => {
            const [gameState, setGameState] = useState('intro'); 
            const [health, setHealth] = useState(100);
            const [mana, setMana] = useState(100);
            const [step, setStep] = useState(0);
            const [isGenerating, setIsGenerating] = useState(false);
            const [currentImage, setCurrentImage] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [audioSrc, setAudioSrc] = useState(''); 
            const audioRef = useRef(null);
            const fileInputRef = useRef(null);

            const story = [
                {
                    title: "Начало пути",
                    text: "Дрыхала стоит на опушке Старого леса. Туман сгущается. Бермяш сжимает твою руку. Что ты сделаешь?",
                    options: [
                        { text: "Сыграть мелодию спокойствия", cost: { mana: 10 }, gain: { health: 5 }, next: 1 },
                        { text: "Идти молча, экономя силы", cost: { health: 10 }, gain: { mana: 10 }, next: 1 }
                    ],
                    prompt: "tiny girl with flute in a misty ancient forest, mossy stones, soft lighting, Ghibli style"
                },
                {
                    title: "Забытая тропа",
                    text: "Вы наткнулись на колючий кустарник. Он шепчет твоё имя. Кажется, он живой.",
                    options: [
                        { text: "Разрубить магией флейты", cost: { mana: 20 }, gain: { health: 0 }, next: 2 },
                        { text: "Попросить Бермяша расчистить путь", cost: { health: 15 }, gain: { mana: 5 }, next: 2 }
                    ],
                    prompt: "magical thorny bushes in a dark forest, tiny heroes, glowing flute"
                },
                {
                    title: "Горный ручей",
                    text: "Вода в ручье черная, как смола. Тени тянутся к твоим ногам.",
                    options: [
                        { text: "Перепрыгнуть, используя ману", cost: { mana: 15 }, gain: { health: 0 }, next: 3 },
                        { text: "Пройти вброд сквозь тени", cost: { health: 25 }, gain: { mana: 10 }, next: 3 }
                    ],
                    prompt: "black water river in fantasy world, shadowy hands, tiny fairy-like girl"
                },
                {
                    title: "Встреча с Дрёмой",
                    text: "Старый Дрёма-отшельник преграждает путь. Он просит плату за проход.",
                    options: [
                        { text: "Отдать часть своей искры (маны)", cost: { mana: 30 }, gain: { health: 10 }, next: 4 },
                        { text: "Попытаться обмануть его музыкой", cost: { mana: 15, health: 10 }, gain: { health: 0 }, next: 4 }
                    ],
                    prompt: "old tiny forest hermit, magical dialogue, fantasy landscape"
                },
                {
                    title: "Башня Безмолвия",
                    text: "Вы у подножия башни. Здесь магия Яха сильнее всего. Воздух тяжелый.",
                    options: [
                        { text: "Создать купол света", cost: { mana: 25 }, gain: { health: 5 }, next: 5 },
                        { text: "Идти быстро, затаив дыхание", cost: { health: 20 }, gain: { mana: 5 }, next: 5 }
                    ],
                    prompt: "tall dark obsidian tower, magical aura, tiny heroes looking up"
                },
                {
                    title: "Ловушка Теней",
                    text: "Тени окружили Бермяша! Он начинает засыпать. Скорее!",
                    options: [
                        { text: "Вложить все силы в Песнь Жизни", cost: { mana: 40 }, gain: { health: 20 }, next: 6 },
                        { text: "Отдать ему свое тепло (жизнь)", cost: { health: 30 }, gain: { mana: 10 }, next: 6 }
                    ],
                    prompt: "shadow spirits attacking a small boy, glowing flute shield"
                },
                {
                    title: "Залы Отражений",
                    text: "Ты видишь свои страхи в зеркалах. Флейта дрожит в руках.",
                    options: [
                        { text: "Закрыть глаза и играть сердцем", cost: { mana: 15 }, gain: { health: 10 }, next: 7 },
                        { text: "Разбить зеркала магией", cost: { mana: 25, health: 5 }, gain: { health: 0 }, next: 7 }
                    ],
                    prompt: "hall of mirrors in a dark castle, tiny girl playing flute, reflections"
                },
                {
                    title: "Библиотека Снов",
                    text: "Здесь хранятся знания Чарадора. Маг Ях оставил здесь стража.",
                    options: [
                        { text: "Усыпить стража колыбельной", cost: { mana: 20 }, gain: { health: 5 }, next: 8 },
                        { text: "Вступить в магический бой", cost: { mana: 15, health: 15 }, gain: { health: 0 }, next: 8 }
                    ],
                    prompt: "magical library, ancient scrolls, giant shadowy owl guard"
                },
                {
                    title: "Мост Над Бездной",
                    text: "Мост рушится под ногами. Бермяш едва держится за край.",
                    options: [
                        { text: "Левитировать его силой флейты", cost: { mana: 35 }, gain: { health: 0 }, next: 9 },
                        { text: "Прыгнуть за ним и вытянуть", cost: { health: 40 }, gain: { mana: 10 }, next: 9 }
                    ],
                    prompt: "broken stone bridge over void, tiny heroes in danger, glowing energy"
                },
                {
                    title: "Тронный зал Яха",
                    text: "Маг Ях сидит на троне. Его глаза — пустота. Он смеется над вами.",
                    options: [
                        { text: "Вызвать резонанс Латара", cost: { mana: 50 }, gain: { health: -10 }, next: 10 },
                        { text: "Искать слабое место в его тени", cost: { health: 20, mana: 10 }, gain: { health: 0 }, next: 10 }
                    ],
                    prompt: "dark sorcerer on a bone throne, tiny girl confronting him, epic scale"
                },
                {
                    title: "Смертельный Сон",
                    text: "Ях наносит удар. Бермяш падает. Весь мир становится серым. Это конец?",
                    options: [
                        { text: "Крикнуть душой через музыку", cost: { health: 30, mana: 30 }, gain: { health: 0 }, next: 11 },
                        { text: "Сдаться тьме...", cost: { health: 100 }, gain: { health: 0 }, next: 11 }
                    ],
                    prompt: "dramatic scene, small boy lying on ground, tiny girl crying over him, dark magic"
                },
                {
                    title: "Явление Лады Явь",
                    text: "Свет ослепляет. Богиня Лада Явь слышит твой зов. Тени начинают гореть.",
                    options: [
                        { text: "Объединить свою искру со светом", cost: { mana: 20, health: 10 }, gain: { health: 0 }, next: 12 },
                        { text: "Просить спасения для Бермяша", cost: { health: 50 }, gain: { health: 0 }, next: 12 }
                    ],
                    prompt: "giant glowing goddess appearing, golden light, shadows disappearing"
                },
                {
                    title: "Решающий миг",
                    text: "Чарадор на грани. Либо ты вернешь жизнь в этот мир, либо уснешь вместе с ним.",
                    options: [
                        { text: "Завершить Песнь Жизни", next: 'check_final' }
                    ],
                    prompt: "beautiful bright valley, sunset, two friends walking away"
                }
            ];

            const currentScene = story[step];

            const generateImage = useCallback(async (p) => {
                const apiKey = "";
                if (!apiKey || !p) return;
                setIsGenerating(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt: p }, parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setCurrentImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) { console.error(e); }
                finally { setIsGenerating(false); }
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && currentScene) generateImage(currentScene.prompt);
            }, [step, gameState]);

            const handleOption = (opt) => {
                if (opt.next === 'check_final') {
                    setGameState(health > 30 ? 'victory' : 'dead');
                    return;
                }

                const newHealth = health - (opt.cost?.health || 0) + (opt.gain?.health || 0);
                const newMana = mana - (opt.cost?.mana || 0) + (opt.gain?.mana || 0);

                setHealth(Math.min(100, Math.max(0, newHealth)));
                setMana(Math.min(100, Math.max(0, newMana)));

                if (newHealth <= 0) {
                    setGameState('dead');
                } else {
                    setStep(opt.next);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setAudioSrc(url);
                    // Safe playback start
                    setTimeout(() => {
                        if (audioRef.current) {
                            audioRef.current.load();
                            audioRef.current.play().catch(err => console.log("Auto-play blocked"));
                        }
                    }, 100);
                }
            };

            const startGame = () => {
                setGameState('playing');
                if (audioRef.current && audioSrc) {
                    audioRef.current.play().catch(err => console.log("Playback failed"));
                }
            };

            if (gameState === 'dead') {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center p-8 death-screen text-center">
                        <Skull className="w-24 h-24 text-red-900 mb-8 animate-pulse" />
                        <h1 className="text-4xl font-bold text-red-500 mb-4 uppercase tracking-tighter">Смертельный сон</h1>
                        <p className="text-stone-400 mb-12 italic">Тени поглотили тебя. Чарадор навсегда погрузился в безмолвие, а ты стала частью вечного тумана...</p>
                        <button onClick={() => window.location.reload()} className="p-5 px-10 bg-red-900/20 border border-red-900/50 rounded-2xl text-red-500 flex items-center gap-2 font-bold uppercase tracking-widest text-xs">
                            <RefreshCw className="w-4 h-4" /> Начать заново
                        </button>
                    </div>
                );
            }

            if (gameState === 'victory') {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center p-8 victory-screen text-center">
                        <Sparkles className="w-24 h-24 text-amber-500 mb-8 animate-bounce" />
                        <h1 className="text-4xl font-bold text-amber-400 mb-4 uppercase tracking-tighter">Свет победил!</h1>
                        <p className="text-amber-100/70 mb-12 italic">Твоя музыка пробудила Ладу Явь. Тени расступились, Бермяш открыл глаза, и Чарадор снова зацвел яркими красками.</p>
                        <button onClick={() => window.location.reload()} className="p-5 px-10 bg-amber-900/20 border border-amber-500/50 rounded-2xl text-amber-400 font-bold uppercase tracking-widest text-xs">
                            Вернуться к началу
                        </button>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full bg-black flex flex-col relative overflow-hidden">
                    {audioSrc && <audio ref={audioRef} src={audioSrc} loop />}
                    
                    {/* Background Art */}
                    <div className="absolute inset-0 z-0">
                        {isGenerating ? (
                            <div className="w-full h-full flex flex-col items-center justify-center bg-stone-950">
                                <Loader2 className="w-8 h-8 text-amber-900 mb-4" />
                                <div className="text-[10px] uppercase tracking-[0.3em] text-amber-900">Духи рисуют мир...</div>
                            </div>
                        ) : currentImage ? (
                            <img src={currentImage} className="w-full h-full object-cover opacity-60 transition-opacity duration-1000" />
                        ) : (
                            <div className="w-full h-full bg-gradient-to-b from-stone-900 to-black" />
                        )}
                        <div className="absolute inset-0 bg-[radial-gradient(circle,transparent_20%,rgba(0,0,0,0.8)_100%)]" />
                    </div>

                    {/* Stats Header */}
                    {gameState === 'playing' && (
                        <div className="relative z-30 p-6 pt-12 flex justify-between items-start">
                            <div className="space-y-4">
                                <div className="flex items-center gap-3 bg-black/30 p-2 pr-4 rounded-full backdrop-blur-md border border-white/5">
                                    <Heart className="w-4 h-4 text-red-600" />
                                    <div className="w-24 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                        <div className={`status-bar h-full ${health < 30 ? 'bg-red-600' : 'bg-red-500'}`} style={{ width: `${health}%` }} />
                                    </div>
                                    <span className="text-[10px] text-red-500 font-bold">{health}</span>
                                </div>
                                <div className="flex items-center gap-3 bg-black/30 p-2 pr-4 rounded-full backdrop-blur-md border border-white/5">
                                    <Zap className="w-4 h-4 text-blue-400" />
                                    <div className="w-24 h-1.5 bg-white/10 rounded-full overflow-hidden">
                                        <div className="status-bar h-full bg-blue-500" style={{ width: `${mana}%` }} />
                                    </div>
                                    <span className="text-[10px] text-blue-400 font-bold">{mana}</span>
                                </div>
                            </div>
                            
                            <div className="flex flex-col gap-2">
                                <button 
                                    onClick={() => { if(audioRef.current) { audioRef.current.muted = !isMuted; setIsMuted(!isMuted); }}}
                                    className="p-3 bg-black/50 rounded-full border border-white/10 text-amber-500 backdrop-blur-xl active:scale-90 transition-transform"
                                >
                                    {isMuted ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
                                </button>
                                <button 
                                    onClick={() => fileInputRef.current.click()}
                                    className="p-3 bg-black/50 rounded-full border border-white/10 text-blue-400 backdrop-blur-xl active:scale-90 transition-transform"
                                >
                                    <Upload className="w-4 h-4" />
                                </button>
                                <input type="file" ref={fileInputRef} className="hidden" accept="audio/*" onChange={handleFileUpload} />
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <div className="relative z-20 flex-1 flex flex-col justify-end p-6 space-y-6 controls-container max-w-lg mx-auto w-full">
                        {gameState === 'intro' ? (
                            <div className="text-center space-y-8 mb-24 animate-pulse">
                                <Music className="w-16 h-16 text-amber-600 mx-auto" />
                                <div>
                                    <h1 className="text-5xl font-bold tracking-[0.2em] text-amber-100 uppercase">Чарадор</h1>
                                    <p className="text-amber-800 text-xs tracking-[0.5em] mt-3 uppercase italic">Наследница флейты</p>
                                </div>
                                <div className="space-y-4 pt-8">
                                    <button 
                                        onClick={startGame}
                                        className="w-full py-5 bg-amber-900/20 border border-amber-600/50 rounded-2xl font-bold text-amber-100 uppercase tracking-widest text-sm shadow-2xl active:scale-95 transition-all"
                                    >
                                        Начать сказку
                                    </button>
                                    <p className="text-[10px] text-stone-500 uppercase tracking-widest">Совет: Загрузи свою музыку через иконку в углу</p>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="scene-enter">
                                    <div className="flex items-center gap-2 mb-2 px-2">
                                        <Shield className="w-3 h-3 text-amber-700" />
                                        <span className="text-[9px] font-bold text-amber-800 uppercase tracking-widest">{currentScene?.title}</span>
                                    </div>
                                    <div className="glass-panel p-6 rounded-[2.5rem] shadow-2xl border-amber-900/20">
                                        <p className="text-amber-50/90 text-lg md:text-xl italic leading-relaxed font-medium">
                                            «{currentScene?.text}»
                                        </p>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-3">
                                    {currentScene?.options.map((opt, i) => (
                                        <button 
                                            key={i} 
                                            onClick={() => handleOption(opt)} 
                                            className="group w-full p-5 bg-stone-900/90 border border-white/5 rounded-3xl text-left flex items-center justify-between active:bg-amber-900/50 transition-all shadow-xl active:scale-[0.98]"
                                        >
                                            <div className="flex-1 pr-4">
                                                <div className="text-sm md:text-base font-semibold text-amber-50 leading-snug">{opt.text}</div>
                                                {opt.cost && (
                                                    <div className="flex gap-4 mt-2 text-[9px] font-bold uppercase tracking-wider opacity-60">
                                                        {opt.cost.mana > 0 && <span className="text-blue-400">Мана: -{opt.cost.mana}</span>}
                                                        {opt.cost.health > 0 && <span className="text-red-500">Жизнь: -{opt.cost.health}</span>}
                                                        {opt.gain?.health > 0 && <span className="text-green-500">Жизнь: +{opt.gain.health}</span>}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="bg-amber-900/20 p-2 rounded-full group-active:bg-amber-500/20">
                                                <ArrowRight className="w-4 h-4 text-amber-900 group-hover:text-amber-500" />
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
