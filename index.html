<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор: Наследие Героев</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap');
        
        :root {
            --celtic-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
        }

        body { 
            background-color: #050505; 
            margin: 0; color: #f5f5f4; 
            font-family: 'Old Standard TT', serif;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
            position: relative;
        }

        .image-frame {
            height: 40vh; width: 100%;
            position: relative; overflow: hidden;
            border-bottom: 2px solid var(--celtic-gold);
            background: #000;
        }

        .content-area {
            height: 60vh; flex-grow: 1;
            overflow-y: auto;
            background: linear-gradient(to bottom, #0f0c0a, #050505);
            padding-bottom: 40px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #1c1917 0%, #0c0a09 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            border-color: var(--celtic-gold);
            box-shadow: 0 0 15px var(--gold-glow);
            background: #1c1917;
        }

        .stat-bar {
            height: 6px; border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loader-ring {
            width: 40px; height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--celtic-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Иконки
        const Icons = {
            Heart: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Sparkles: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L9 9l-8 3 8 3 3 8 3-8 8-3-8-3-3-8z"/></svg>,
            User: () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Music: () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Flame: () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 3.333 3 5 1.333 2.222.5 4.667-1 6-1.5 1.333-3 1.333-4.5 0Z"/><path d="M15.812 9.176c.453.366.925.994.925 1.824 0 1.213-.667 2.333-2 3.333-.746.556-1.12.834-1.12 1.25s.374.694 1.12 1.25c1.333 1 2 2.12 2 3.333 0 .83-.472 1.458-.925 1.824"/></svg>
        };

        const STORY_DATA = [
            {
                id: 0, title: "Пробуждение",
                text: "Дремуш в огне. Туман Смергов поглощает дома. Вы стоите на пороге, чувствуя, как ваша сила вибрирует от близости тьмы. Куда ведет ваш путь?",
                prompt: "Digital art, Ghibli style, a burning fantasy village at night, purple magical fog, high contrast, cinematic anime lighting, emotional atmosphere.",
                options: [
                    { text: "Спасти старейшину из огня", change: { hp: -10, mp: +15 }, label: "Героизм" },
                    { text: "Скрыться в лесу, экономя силы", change: { hp: +5, mp: -5 }, label: "Осторожность" }
                ]
            },
            {
                id: 1, title: "Серебряное Озеро",
                text: "Вода замерзла вопреки лету. В центре озера — воронка Тьмы. Смерги пируют силой воды.",
                prompt: "Stunning anime art, a frozen silver lake with a dark magical vortex in the center, ethereal blue glow, sharp ice crystals, professional 2D illustration.",
                options: [
                    { text: "Очистить воду заклинанием", change: { hp: +10, mp: -25 }, label: "Свет" },
                    { text: "Обойти по тонкому льду", change: { hp: -20, mp: +5 }, label: "Риск" }
                ]
            },
            {
                id: 2, title: "Шепот Камышей",
                text: "Раненый дух-хранитель молит о помощи. Его магия угасает.",
                prompt: "Fantasy anime scene, tall golden reeds by a river, a small glowing spirit trapped in dark thorny vines, soft sunset lighting.",
                options: [
                    { text: "Исцелить духа своей кровью", change: { hp: -15, mp: +20 }, label: "Жертва" },
                    { text: "Забрать остатки его магии себе", change: { hp: +20, mp: -10 }, label: "Тьма" }
                ]
            }
            // ... (остальные сцены добавляются по аналогии)
        ];

        const App = () => {
            const [gameState, setGameState] = useState('char_select');
            const [hero, setHero] = useState(null);
            const [step, setStep] = useState(0);
            const [stats, setStats] = useState({ hp: 100, mp: 100 });
            const [image, setImage] = useState(null);
            const [loadingImg, setLoadingImg] = useState(false);
            
            const apiKey = ""; // API ключ подставится средой

            const fetchImage = async (prompt) => {
                if (!apiKey) return;
                setLoadingImg(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: [{ prompt }],
                            parameters: { sampleCount: 1 }
                        })
                    });
                    const data = await response.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) {
                    console.error("Image generation failed", e);
                } finally {
                    setLoadingImg(false);
                }
            };

            useEffect(() => {
                if (gameState === 'playing') {
                    fetchImage(STORY_DATA[step].prompt);
                }
            }, [step, gameState]);

            const selectHero = (type) => {
                setHero(type);
                setStats(type === 'Bermyash' ? { hp: 120, mp: 80 } : { hp: 80, mp: 120 });
                setGameState('playing');
            };

            const handleChoice = (opt) => {
                const nextHp = Math.min(100, Math.max(0, stats.hp + (opt.change.hp || 0)));
                const nextMp = Math.min(100, Math.max(0, stats.mp + (opt.change.mp || 0)));
                
                setStats({ hp: nextHp, mp: nextMp });

                if (nextHp <= 0) {
                    setGameState('gameover');
                } else if (step + 1 < STORY_DATA.length) {
                    setStep(step + 1);
                } else {
                    setGameState('victory');
                }
            };

            if (gameState === 'char_select') return (
                <div className="h-screen bg-[#080707] flex flex-col items-center justify-center p-6 text-center">
                    <h1 className="text-4xl font-bold text-amber-50 mb-10">Выберите своего героя</h1>
                    <div className="grid grid-cols-1 gap-6 w-full max-w-md">
                        <button onClick={() => selectHero('Bermyash')} className="choice-btn p-6 rounded-2xl flex flex-col items-center gap-3">
                            <Icons.Flame />
                            <span className="text-xl font-bold text-amber-100">Бермяш</span>
                            <span className="text-xs text-stone-500 italic">Магия в Волшебном Котле. Крепкое здоровье, тяжелые заклинания.</span>
                        </button>
                        <button onClick={() => selectHero('Dryhala')} className="choice-btn p-6 rounded-2xl flex flex-col items-center gap-3">
                            <Icons.Music />
                            <span className="text-xl font-bold text-amber-100">Дрыхала</span>
                            <span className="text-xs text-stone-500 italic">Магия в Волшебной Флейте. Хрупкая жизнь, бесконечный поток маны.</span>
                        </button>
                    </div>
                </div>
            );

            if (gameState === 'gameover') return (
                <div className="h-screen bg-black flex flex-col items-center justify-center text-center p-10">
                    <h2 className="text-5xl font-bold text-red-800 mb-6">Песнь оборвалась</h2>
                    <button onClick={() => window.location.reload()} className="px-8 py-3 border border-stone-700 text-stone-500 uppercase tracking-widest text-xs hover:text-white transition-colors">Начать заново</button>
                </div>
            );

            const scene = STORY_DATA[step];

            return (
                <div className="game-container">
                    <div className="image-frame">
                        {loadingImg ? (
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <div className="loader-ring mb-4"></div>
                                <span className="text-[10px] text-amber-500/50 uppercase tracking-widest">Проявление реальности...</span>
                            </div>
                        ) : (
                            <img src={image || "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000"} className="w-full h-full object-cover transition-opacity duration-1000" alt="scene" />
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0f0c0a] to-transparent" />
                        
                        <div className="absolute top-4 left-4 right-4 flex justify-between">
                            <div className="bg-black/50 backdrop-blur-md p-3 rounded-xl border border-white/5 space-y-2">
                                <div className="flex items-center gap-3">
                                    <Icons.Heart />
                                    <div className="w-32 bg-stone-900 rounded-full h-1.5 overflow-hidden">
                                        <div className="stat-bar bg-red-600" style={{width: `${stats.hp}%`}} />
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <Icons.Sparkles />
                                    <div className="w-32 bg-stone-900 rounded-full h-1.5 overflow-hidden">
                                        <div className="stat-bar bg-blue-500" style={{width: `${stats.mp}%`}} />
                                    </div>
                                </div>
                            </div>
                            <div className="bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full flex items-center">
                                <span className="text-[10px] font-bold text-amber-500">{hero === 'Bermyash' ? 'БЕРМЯШ' : 'ДРЫХАЛА'}</span>
                            </div>
                        </div>
                    </div>

                    <div className="content-area p-6">
                        <div className="max-w-xl mx-auto flex flex-col h-full">
                            <div className="mb-2 text-center">
                                <span className="text-[10px] text-amber-600 font-bold uppercase tracking-[0.4em]">{scene.title}</span>
                            </div>
                            
                            <p className="text-lg leading-relaxed text-stone-200 italic text-center mb-8 px-4">
                                "{scene.text}"
                            </p>

                            <div className="space-y-4 mt-auto">
                                {scene.options.map((opt, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => handleChoice(opt)}
                                        className="choice-btn w-full p-5 rounded-xl text-left group"
                                    >
                                        <div className="flex items-center justify-between mb-1">
                                            <span className="text-[9px] text-amber-700 font-bold uppercase tracking-widest">{opt.label}</span>
                                            <div className="flex gap-3">
                                                {opt.change.hp !== 0 && (
                                                    <span className={`text-[9px] font-bold ${opt.change.hp > 0 ? 'text-green-500' : 'text-red-500'}`}>
                                                        ОЗ {opt.change.hp > 0 ? '+' : ''}{opt.change.hp}
                                                    </span>
                                                )}
                                                {opt.change.mp !== 0 && (
                                                    <span className={`text-[9px] font-bold ${opt.change.mp > 0 ? 'text-blue-400' : 'text-blue-700'}`}>
                                                        МП {opt.change.mp > 0 ? '+' : ''}{opt.change.mp}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="text-amber-50 text-sm">{opt.text}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
