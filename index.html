<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чарадор: Наследница флейты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:italic,wght@400;700&display=swap');
        
        body { 
            background-color: #0c0a09; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            color: #e7e5e4; 
            font-family: 'Old Standard TT', serif; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .scene-enter { animation: fadeIn 2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }

        .resonance-bar {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .bg-vignette {
            background: radial-gradient(circle, transparent 20%, rgba(12, 10, 9, 0.95) 100%);
        }

        .glass-panel {
            background: rgba(28, 25, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Music, Heart, ArrowRight, Sparkles, Wind, Shield, Wand2 } = {
            Music: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Heart: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>,
            ArrowRight: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>,
            Sparkles: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        };

        const { useState, useEffect, useCallback } = React;

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [resonance, setResonance] = useState(40); // Базовый резонанс
            const [history, setHistory] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [currentImage, setCurrentImage] = useState(null);
            const [error, setError] = useState(null);
            const [tg, setTg] = useState(null);

            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    const webapp = window.Telegram.WebApp;
                    webapp.ready();
                    webapp.expand();
                    webapp.headerColor = '#0c0a09';
                    setTg(webapp);
                }
            }, []);

            const scenes = [
                {
                    id: 'start',
                    title: 'Изумрудный Чарадор',
                    text: 'Вы — Дрыхала, маленькая дрома ростом всего 30 см. Ваша спокойная жизнь в общине меняется навсегда, когда вам передают Латар — древнюю флейту Хранителя. Ваш верный друг Бермяш уже поправляет лямки котомки у порога. Вы чувствуете, что без его открытого сердца эта флейта — лишь безжизненное дерево.',
                    options: [
                        { text: 'Взять Латар и довериться Бермяшу', next: 'myrin', effect: { resonance: 15 } },
                        { text: 'Сыграть пробную ноту, слушая тишину', next: 'myrin', effect: { resonance: 5 } }
                    ],
                    imagePrompt: 'Tiny 30cm humanoid with a wooden flute, emerald forest village, Slavic solar patterns, Studio Ghibli style, atmospheric lighting, soft focus'
                },
                {
                    id: 'myrin',
                    title: 'Мирин: Индустриальная готика',
                    text: 'Дорога ведет к заброшенному терем-граду волшебников — Мирину. Здесь уральская мощь камня сливается с магией металла. Командир Престан на исполинском сове преграждает путь: «Тьма Смергов уже близко. Готова ли ты пробудить память предков, Эладара?»',
                    options: [
                        { text: 'Сыграть Гимн Пробуждения', next: 'error', effect: { resonance: 20 } },
                        { text: 'Просить защиты у ланов на совах', next: 'error', effect: { resonance: -10 } }
                    ],
                    imagePrompt: 'Giant industrial wooden fortress in snowy mountains, huge owls flying, Ural industrial gothic style, cinematic fog, minerals'
                },
                {
                    id: 'error',
                    title: 'Роковая Ошибка',
                    text: 'Музыка Латара открывает Врата Вэдхильма, но вместо предков пробуждается маг Ях. Небо чернеет от Смергов — бесплотных теней. Мирин рушится под натиском Пустоты. Престан исчезает в магическом вихре, давая вам шанс бежать в Белогорье.',
                    options: [
                        { text: 'Крепче сжать руку Бермяша и бежать', next: 'belogorye', effect: { resonance: 30 } }
                    ],
                    imagePrompt: 'Ethereal shadow wraiths attacking a magical city, purple and black magic, collapsing stone towers, dramatic action'
                },
                {
                    id: 'belogorye',
                    title: 'Смертельный Сон',
                    text: 'В Белогорье вас настигает Ях. Его темное заклятие поражает Бермяша. Ваш друг — ваш живой камертон — засыпает Смертельным Сном. Флейта в ваших руках мгновенно замолкает. Вы остались одна против наступающей Тьмы Мультивселенной.',
                    options: [
                        { text: 'Играть Песнь Жизни из чистой любви', next: 'victory', effect: { resonance: 50 } },
                        { text: 'Поддаться ярости и мести', next: 'victory', effect: { resonance: -30 } }
                    ],
                    imagePrompt: 'Tiny drama weeping over a fallen friend, silver birch forest, misty morning, emotional lighting, cinematic'
                },
                {
                    id: 'victory',
                    title: 'Сила Двоих',
                    text: 'Ваша музыка резонирует с душой Бермяша. Это не просто звук, а крик Хранителя. Золотое сияние Лады Явь выжигает тени. Маг Ях отступил, похитив миролик, но вы осознаете: вы больше не испуганная беглянка. Вы — Хранитель Тарры.',
                    options: [
                        { text: 'Принять свою судьбу Хранителя', next: 'intro', effect: { resonance: 0 } }
                    ],
                    imagePrompt: 'Golden Slavic goddess appearance, light overcoming darkness in a winter forest, rebirth'
                }
            ];

            const currentSceneId = history[history.length - 1]?.next || 'start';
            const currentScene = scenes.find(s => s.id === currentSceneId);

            const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                    throw err;
                }
            };

            const generateImage = useCallback(async (prompt) => {
                if (!prompt) return;
                setIsGenerating(true);
                setError(null);
                try {
                    const apiKey = ""; // API Key подставляется средой
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    const result = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: prompt },
                            parameters: { sampleCount: 1 }
                        })
                    });
                    if (result.predictions?.[0]?.bytesBase64Encoded) {
                        setCurrentImage(`data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (err) {
                    setError("Видение Многоземья затуманено...");
                } finally {
                    setIsGenerating(false);
                }
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && currentScene?.imagePrompt) {
                    generateImage(currentScene.imagePrompt);
                }
            }, [currentScene?.id, gameState, generateImage]);

            const handleOption = (option) => {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                
                const newResonance = Math.min(100, Math.max(0, resonance + (option.effect?.resonance || 0)));
                setResonance(newResonance);
                
                if (option.next === 'intro') {
                    setHistory([]);
                    setResonance(40);
                    setGameState('intro');
                    setCurrentImage(null);
                } else {
                    setHistory([...history, option]);
                }
            };

            if (gameState === 'intro') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center space-y-12 bg-stone-950 text-amber-50">
                        <div className="relative">
                            <div className="absolute -inset-10 border border-amber-500/10 rounded-full animate-pulse"></div>
                            <Music className="w-20 h-20 text-amber-500 mx-auto" />
                        </div>
                        <div className="space-y-4">
                            <h1 className="text-4xl font-bold tracking-[0.3em] uppercase text-amber-100">Чарадор</h1>
                            <p className="text-amber-500/60 italic tracking-widest text-xs uppercase font-sans">Наследница флейты</p>
                        </div>
                        <p className="text-stone-400 text-sm max-w-xs leading-relaxed italic">
                            «Древний артефакт остается безжизненным деревом, пока не резонирует с чистотой открытого сердца...»
                        </p>
                        <button 
                            onClick={() => setGameState('playing')}
                            className="w-full max-w-xs py-5 bg-amber-900/40 hover:bg-amber-800/60 border border-amber-500/30 text-amber-200 font-bold rounded-full transition-all active:scale-95 uppercase tracking-widest text-xs resonance-bar"
                        >
                            Пробудить связь
                        </button>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-black flex flex-col relative overflow-hidden">
                    {/* Background Layer */}
                    <div className="absolute inset-0 z-0">
                        {isGenerating ? (
                            <div className="w-full h-full flex items-center justify-center bg-stone-950">
                                <Sparkles className="w-8 h-8 text-amber-500/20 animate-spin" />
                            </div>
                        ) : currentImage ? (
                            <img src={currentImage} className="w-full h-full object-cover opacity-50 transition-opacity duration-1000" />
                        ) : null}
                        <div className="absolute inset-0 bg-vignette"></div>
                    </div>

                    {/* Stats Header */}
                    <div className="relative z-20 p-6 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <Heart className={`w-5 h-5 transition-colors duration-500 ${resonance > 70 ? 'text-red-500' : 'text-amber-800'}`} />
                            <div className="h-1.5 w-32 bg-stone-800 rounded-full overflow-hidden border border-white/5">
                                <div className="h-full bg-amber-500 transition-all duration-1000" style={{ width: `${resonance}%` }}></div>
                            </div>
                        </div>
                        <span className="text-[10px] font-bold text-amber-500 uppercase tracking-widest">Резонанс: {resonance}%</span>
                    </div>

                    {/* Narrative Area */}
                    <div className="relative z-10 flex-1 flex flex-col justify-end p-6 pb-12 space-y-8 max-w-xl mx-auto w-full">
                        <div className="scene-enter space-y-5">
                            <div className="inline-block px-3 py-1 bg-amber-900/40 border border-amber-500/30 rounded-md text-[10px] uppercase tracking-widest text-amber-200">
                                {currentScene?.title}
                            </div>
                            <div className="glass-panel p-6 rounded-2xl">
                                <p className="text-stone-100 text-lg leading-relaxed italic">«{currentScene?.text}»</p>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {currentScene?.options.map((opt, i) => (
                                <button 
                                    key={i} 
                                    onClick={() => handleOption(opt)} 
                                    className="group w-full p-5 bg-white/[0.03] hover:bg-amber-900/20 border border-white/5 hover:border-amber-500/30 rounded-2xl text-left flex items-center justify-between transition-all active:scale-[0.98]"
                                >
                                    <span className="text-sm text-stone-300 group-hover:text-amber-100 transition-colors pr-4">{opt.text}</span>
                                    <ArrowRight className="w-4 h-4 text-amber-900 group-hover:text-amber-500 transition-transform group-hover:translate-x-1" />
                                </button>
                            ))}
                        </div>
                        
                        {error && <div className="text-[10px] text-amber-900 text-center uppercase tracking-widest">{error}</div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
