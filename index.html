<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:italic,wght@400;700&display=swap');
        
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        body { 
            background-color: #0c0a09; 
            margin: 0; padding: 0; 
            color: #e7e5e4; 
            font-family: 'Old Standard TT', serif;
            overscroll-behavior: none;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 10px; }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(2rem + var(--safe-area-inset-bottom));
        }

        .glass-card {
            background: rgba(18, 14, 12, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .status-bar-fill { transition: width 0.5s ease-out; }
        
        .image-container {
            height: 45vh;
            min-height: 280px;
            position: relative;
            flex-shrink: 0;
        }

        .img-mask {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, #0c0a09 0%, transparent 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Heart, Zap, Volume2, VolumeX, ArrowRight, Loader2, Feather, Music } = {
            Heart: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Zap: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
            Volume2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            VolumeX: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>,
            ArrowRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
            Loader2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Feather: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg>,
            Music: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        };

        const { useState, useEffect, useRef } = React;

        const STORY_DATA = [
            {
                title: "Глава I: Прощание",
                text: "Ветер колышет подол твоего платья. Ты стоишь на краю деревни. В футляре за спиной — Флейта Рассвета. Путь в Чарадор опасен, но музыка не может ждать.",
                prompt: "Beautiful anime landscape, a young girl from behind looking at a dark magical forest in distance, cinematic sunset, Ghibli style, detailed clouds, high fantasy",
                options: [
                    { text: "Сыграть прощальную песню", cost: { mana: 15 }, next: 1 },
                    { text: "Уйти молча, беречь силы", cost: { health: 5 }, next: 1 }
                ]
            },
            {
                title: "Шепот Леса",
                text: "Деревья здесь имеют глаза. Бермяш испуганно жмется к твоим ногам. Тени сгущаются.",
                prompt: "Spooky dark fantasy forest, glowing eyes in bushes, gnarled ancient trees, cinematic low angle, moody lighting",
                options: [
                    { text: "Осветить путь мелодией", cost: { mana: 20 }, next: 2 },
                    { text: "Пробираться сквозь тернии", cost: { health: 15 }, next: 2 }
                ]
            }
            // Можно добавить остальные главы позже
        ];

        const App = () => {
            const [scene, setScene] = useState('intro');
            const [step, setStep] = useState(0);
            const [stats, setStats] = useState({ hp: 100, mp: 100 });
            const [image, setImage] = useState(null);
            const [loadingImg, setLoadingImg] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const audioRef = useRef(null);

            const generateArt = async (prompt) => {
                const apiKey = ""; // API ключ подставится автоматически
                if (!apiKey) return;
                setLoadingImg(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) { console.error(e); }
                setLoadingImg(false);
            };

            useEffect(() => {
                if (scene === 'playing') generateArt(STORY_DATA[step].prompt);
            }, [step, scene]);

            const startPlaying = () => {
                setScene('playing');
                if (audioRef.current) {
                    audioRef.current.play().catch(e => console.log("Audio play blocked", e));
                }
            };

            const handleOption = (opt) => {
                const newHp = Math.max(0, stats.hp - (opt.cost?.health || 0));
                const newMp = Math.max(0, stats.mp - (opt.cost?.mana || 0));
                setStats({ hp: newHp, mp: newMp });
                
                if (newHp <= 0) setScene('gameover');
                else if (step + 1 < STORY_DATA.length) setStep(step + 1);
                else setScene('victory');
            };

            if (scene === 'intro') return (
                <div className="h-screen bg-[#0c0a09] flex flex-col items-center justify-center p-6 text-center">
                    <Feather className="w-12 h-12 text-amber-600 mb-4 animate-pulse" />
                    <h1 className="text-5xl font-bold tracking-tighter text-amber-50 mb-2">ЧАРАДОР</h1>
                    <p className="text-amber-800 text-xs uppercase tracking-[0.3em] mb-12">Наследница Флейты</p>
                    <button onClick={startPlaying} className="w-full max-w-xs py-4 bg-amber-700 text-black rounded-xl font-bold uppercase tracking-widest shadow-lg active:scale-95 transition-transform">
                        Начать путь
                    </button>
                    <audio ref={audioRef} src="1-2 Начало пути. Прощание с домом.mp3" loop />
                </div>
            );

            if (scene === 'gameover') return (
                <div className="h-screen bg-black flex flex-col items-center justify-center p-6 text-center">
                    <h2 className="text-4xl font-bold text-red-900 mb-4">МУЗЫКА СМОЛКЛА</h2>
                    <button onClick={() => window.location.reload()} className="text-stone-500 underline uppercase text-xs">Попробовать снова</button>
                </div>
            );

            const current = STORY_DATA[step];

            return (
                <div className="game-container">
                    <audio ref={audioRef} src="1-2 Начало пути. Прощание с домом.mp3" loop />
                    
                    {/* Арт */}
                    <div className="image-container">
                        {loadingImg ? (
                            <div className="absolute inset-0 flex items-center justify-center bg-stone-900">
                                <Loader2 className="w-8 h-8 text-amber-700" />
                            </div>
                        ) : (
                            <img src={image || "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&q=80&w=1000"} className="w-full h-full object-cover" />
                        )}
                        <div className="img-mask" />
                        
                        {/* Статы поверх арта */}
                        <div className="absolute top-10 left-4 right-4 flex justify-between items-center">
                            <div className="flex gap-2">
                                <div className="bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 flex items-center gap-2">
                                    <Heart className="w-3 h-3 text-red-500" />
                                    <span className="text-xs font-bold">{stats.hp}</span>
                                </div>
                                <div className="bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 flex items-center gap-2">
                                    <Zap className="w-3 h-3 text-blue-400" />
                                    <span className="text-xs font-bold">{stats.mp}</span>
                                </div>
                            </div>
                            <button onClick={() => { if(audioRef.current) audioRef.current.muted = !isMuted; setIsMuted(!isMuted); }} className="p-2 bg-black/40 backdrop-blur-md rounded-full border border-white/10">
                                {isMuted ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
                            </button>
                        </div>
                    </div>

                    {/* Контент с прокруткой */}
                    <div className="scroll-area glass-card">
                        <div className="p-6 pt-2">
                            <div className="mb-6">
                                <span className="text-[10px] text-amber-600 font-bold uppercase tracking-[0.4em]">{current.title}</span>
                                <p className="text-xl md:text-2xl mt-2 leading-relaxed text-stone-200 italic font-serif">
                                    «{current.text}»
                                </p>
                            </div>

                            <div className="space-y-3">
                                {current.options.map((opt, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => handleOption(opt)}
                                        className="w-full p-5 bg-stone-900/50 border border-white/5 rounded-2xl text-left flex items-center justify-between group active:bg-amber-900/20 transition-colors"
                                    >
                                        <div>
                                            <div className="text-amber-100 group-hover:text-amber-400 transition-colors">{opt.text}</div>
                                            {(opt.cost) && (
                                                <div className="text-[9px] uppercase tracking-widest text-stone-500 mt-1">
                                                    {opt.cost.mana ? `Расход маны: ${opt.cost.mana}` : `Расход здоровья: ${opt.cost.health}`}
                                                </div>
                                            )}
                                        </div>
                                        <ArrowRight className="w-4 h-4 text-stone-700" />
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
