<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чарадор: Наследница флейты</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем React и Tailwind для стилей -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:italic,wght@400;700&display=swap');
        body { background-color: #0c0a09; margin: 0; padding: 0; overflow-x: hidden; color: #e7e5e4; }
        .font-serif { font-family: 'Old Standard TT', serif; }
        .scene-enter { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Music, Heart, ArrowRight, Sparkles, Send, Shield, Moon } = {
            Music: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Heart: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>,
            ArrowRight: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>,
            Sparkles: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>,
            Send: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>,
            Shield: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path></svg>,
            Moon: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        };

        const { useState, useEffect, useCallback } = React;

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [resonance, setResonance] = useState(50);
            const [history, setHistory] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [currentImage, setCurrentImage] = useState(null);
            const [error, setError] = useState(null);
            const [tg, setTg] = useState(null);

            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    const webapp = window.Telegram.WebApp;
                    webapp.ready();
                    webapp.expand();
                    setTg(webapp);
                }
            }, []);

            const scenes = [
                {
                    id: 'start',
                    title: 'Уютный Чарадор',
                    text: 'В изумрудном мире Чарадор сегодня необычайно тихо. Вы — Дрыхала, маленькая дрёма ростом всего в ладонь. В ваших руках — Латар, древняя флейта. Ваш верный друг Бермяш уже собрал котомку. Вы чувствуете странный зов артефакта к заброшенному городу Мирин...',
                    options: [
                        { text: 'Довериться интуиции и Латару', next: 'myrin_approach', effect: { resonance: 5 } },
                        { text: 'Спросить Бермяша, готов ли он', next: 'myrin_approach', effect: { resonance: 15 } }
                    ],
                    imagePrompt: 'Tiny magical person holding an ethnic wooden flute, cozy emerald forest village, Slavic solar ornaments, digital painting, Hayao Miyazaki style'
                },
                {
                    id: 'myrin_approach',
                    title: 'Терем-град Мирин',
                    text: 'Стены Мирина пугают своим величием. Здесь вы встречаете Престана, командира наездников на совах. "Тьма близко," — предупреждает он. Вы решаете войти внутрь цитадели.',
                    options: [
                        { text: 'Сыграть мелодию памяти предков', next: 'awakening', effect: { resonance: 10 } }
                    ],
                    imagePrompt: 'Ancient giant wooden citadel in the fog, giant owls flying above, industrial gothic elements, emerald glow'
                },
                {
                    id: 'awakening',
                    title: 'Роковая Ошибка',
                    text: 'Ваша музыка пробуждает не только память, но и Зло. Из теней вырываются Смерги — бесплотные тени Мага Яха. Они пожирают жизненную искру мира. Чарадор под ударом!',
                    options: [
                        { text: 'Бежать в Белогорье к берендеям', next: 'belogorye', effect: { resonance: -10 } },
                        { text: 'Защитить Бермяша песней', next: 'belogorye', effect: { resonance: 20 } }
                    ],
                    imagePrompt: 'Shadowy ethereal ghosts attacking a wooden city, purple magical energy, intense cinematic lighting'
                },
                {
                    id: 'belogorye',
                    title: 'Наследница Эладара',
                    text: 'В Белогорье вы узнаете правду: вы — Эладара, наследница древнего долга. Латар — ключ к Древу Миров. Но маг Ях уже здесь! Он поражает Бермяша заклятием Смертельного Сна.',
                    options: [
                        { text: 'Впасть в месть и ярость', next: 'battle_end', effect: { resonance: -30 } },
                        { text: 'Искать в душе Песнь Жизни', next: 'finale', effect: { resonance: 50 } }
                    ],
                    imagePrompt: 'Magical forest with giant white trees, tiny heroes facing a dark sorcerer, emotional scene'
                },
                {
                    id: 'finale',
                    title: 'Песнь Жизни',
                    text: 'Ваша музыка — это крик любви, а не мести. Богиня Лада Явь является на ваш зов, выжигая Тень. Бермяш открывает глаза. Вы теперь Хранитель, и война за Многоземье только началась.',
                    options: [
                        { text: 'Вернуться к истоку', next: 'intro', effect: { resonance: 0 } }
                    ],
                    imagePrompt: 'Radiant golden goddess appearing in a winter forest, light overcoming darkness, rebirth theme'
                }
            ];

            const currentSceneId = history[history.length - 1]?.next || 'start';
            const currentScene = scenes.find(s => s.id === currentSceneId);

            const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                    throw err;
                }
            };

            const generateImage = useCallback(async (prompt) => {
                if (!prompt) return;
                setIsGenerating(true);
                setError(null);
                try {
                    const apiKey = ""; // Будет подставлено автоматически
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    const result = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: `Cinematic fantasy art, ${prompt}, high detail, 8k, vibrant colors, Slavic folklore vibes` },
                            parameters: { sampleCount: 1 }
                        })
                    });
                    if (result.predictions?.[0]?.bytesBase64Encoded) {
                        setCurrentImage(`data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (err) {
                    setError("Туман Бездны скрыл видение...");
                } finally {
                    setIsGenerating(false);
                }
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && currentScene?.imagePrompt) {
                    generateImage(currentScene.imagePrompt);
                }
            }, [currentScene?.id, gameState, generateImage]);

            const handleOption = (option) => {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                const newResonance = Math.min(100, Math.max(0, resonance + (option.effect?.resonance || 0)));
                setResonance(newResonance);
                if (option.next === 'intro') {
                    setHistory([]);
                    setResonance(50);
                    setGameState('intro');
                    setCurrentImage(null);
                } else {
                    setHistory([...history, option]);
                }
            };

            if (gameState === 'intro') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center space-y-12 bg-stone-950">
                        <div className="relative">
                            <div className="absolute -inset-8 border border-amber-500/20 rounded-full animate-pulse"></div>
                            <Music className="w-20 h-20 text-amber-500 mx-auto" />
                        </div>
                        <div className="space-y-4">
                            <h1 className="text-5xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-amber-700 uppercase tracking-widest">Чарадор</h1>
                            <p className="text-amber-500/60 text-sm font-serif italic">Наследница флейты Латар</p>
                        </div>
                        <button 
                            onClick={() => setGameState('playing')}
                            className="w-full max-w-xs py-5 bg-amber-800 hover:bg-amber-700 text-white font-bold rounded-2xl shadow-2xl transition-all active:scale-95"
                        >
                            ОТКРЫТЬ ГЛАВУ 1
                        </button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-stone-950 flex flex-col relative overflow-hidden">
                    {/* Image Layer */}
                    <div className="absolute inset-0 z-0">
                        {isGenerating ? (
                            <div className="w-full h-full flex items-center justify-center">
                                <div className="w-12 h-12 border-2 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
                            </div>
                        ) : currentImage ? (
                            <img src={currentImage} className="w-full h-full object-cover opacity-50" />
                        ) : null}
                        <div className="absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-950/40 to-transparent"></div>
                    </div>

                    {/* Stats Header */}
                    <div className="relative z-20 p-5 flex justify-between items-center backdrop-blur-md bg-black/30 border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <Heart className={`w-6 h-6 ${resonance > 70 ? 'text-red-500 animate-pulse' : 'text-amber-700'}`} />
                            <div className="h-2 w-32 bg-stone-800 rounded-full">
                                <div className="h-full bg-amber-500 transition-all duration-1000" style={{ width: `${resonance}%` }}></div>
                            </div>
                        </div>
                        <span className="text-xs font-bold text-amber-500 tracking-tighter uppercase">Резонанс: {resonance}%</span>
                    </div>

                    {/* Content Area */}
                    <div className="relative z-10 flex-1 flex flex-col justify-end p-6 pb-12 space-y-6 max-w-2xl mx-auto w-full">
                        <div className="scene-enter space-y-4">
                            <h2 className="text-3xl font-serif font-bold text-white leading-tight drop-shadow-lg">{currentScene?.title}</h2>
                            <div className="bg-black/60 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-2xl">
                                <p className="text-stone-100 leading-relaxed text-lg font-serif italic">{currentScene?.text}</p>
                            </div>
                        </div>

                        <div className="grid gap-3">
                            {currentScene?.options.map((opt, i) => (
                                <button key={i} onClick={() => handleOption(opt)} className="group w-full p-4 bg-white/5 hover:bg-amber-900/40 border border-white/10 rounded-2xl text-left flex items-center justify-between transition-all active:scale-95">
                                    <span className="text-sm text-stone-300 group-hover:text-white">{opt.text}</span>
                                    <ArrowRight className="w-4 h-4 text-amber-500" />
                                </button>
                            ))}
                        </div>
                        
                        {error && <div className="text-[10px] text-red-500/70 text-center uppercase tracking-widest">{error}</div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
