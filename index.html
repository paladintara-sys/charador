<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарадор: Наследие</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap');
        
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --celtic-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
        }

        body { 
            background-color: #080707; 
            margin: 0; padding: 0; 
            color: #f5f5f4; 
            font-family: 'Old Standard TT', serif;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .image-frame {
            height: 35vh;
            width: 100%;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            overflow: hidden;
            border-bottom: 2px solid var(--celtic-gold);
        }

        .content-area {
            height: 65vh;
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(30px + var(--safe-area-inset-bottom));
            background: linear-gradient(to bottom, #120e0c, #080707);
        }

        .ornament-border {
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px 16px;
            margin: 12px;
            min-height: calc(100% - 24px);
            background: rgba(18, 14, 12, 0.8);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .choice-btn {
            background: linear-gradient(135deg, #1c1917 0%, #0c0a09 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .choice-btn:hover {
            border-color: var(--celtic-gold);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #2a2522 0%, #1c1917 100%);
        }

        .choice-btn:active {
            transform: scale(0.96) translateY(0);
            background: rgba(212, 175, 55, 0.2);
        }

        /* Анимация золотого блеска */
        .choice-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 20%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(30deg);
            transition: 0.8s;
        }

        .choice-btn:hover::after {
            left: 130%;
        }

        .celtic-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            fill: var(--celtic-gold);
            opacity: 0.5;
            pointer-events: none;
        }

        .content-area::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Heart, Sparkles, Volume2, VolumeX, ChevronRight, Skull, ShieldCheck, Music } = {
            Heart: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Sparkles: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L9 9l-8 3 8 3 3 8 3-8 8-3-8-3-3-8z"/></svg>,
            Volume2: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            VolumeX: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>,
            ChevronRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>,
            Skull: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2C6.48 2 2 6.48 2 12C2 14.59 3.02 16.94 4.65 18.73L4.65 22L8 22L8 20L16 20L16 22L19.35 22L19.35 18.73C20.98 16.94 22 14.59 22 12C22 6.48 17.52 2 12 2Z"/></svg>,
            Music: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        };

        const CelticCorner = ({className}) => (
            <svg viewBox="0 0 100 100" className={className}>
                <path d="M0,0 L100,0 L100,5 L5,5 L5,100 L0,100 Z M20,20 L80,20 L80,25 L25,25 L25,80 L20,80 Z" />
            </svg>
        );

        const STORY_DATA = [
            {
                id: 0, title: "Пробуждение",
                text: "Дремуш в огне. Вы с Бермяшем покидаете уютную хижину. Туман Смергов уже у порога. Латар в руках греется — флейта чувствует врага. Куда вы направитесь сначала?",
                prompt: "Anime style digital art, Ghibli aesthetic, a tiny cottage on fire in a mystical forest, purple magical fog encroaching, two small heroes standing in front, vibrant embers, emotional lighting, high quality 2D.",
                options: [
                    { text: "К Серебряному озеру (Там есть путь)", cost: { mp: 5 }, label: "Надежда" },
                    { text: "Вглубь Чернолесья (Скрыться в тенях)", cost: { hp: 10 }, label: "Осторожность" }
                ]
            },
            {
                id: 1, title: "Серебряная Гладь",
                text: "Озеро дышит магией. Вода замерзла, превратившись в зеркало. Смерги скользят по поверхности. Нужно перейти на тот берег.",
                prompt: "Beautiful anime scene, frozen silver lake reflecting a starry night sky, tiny figures walking on ice, magical blue glow from under the water, ethereal atmosphere, Makoto Shinkai style.",
                options: [
                    { text: "Играть мелодию Льда", cost: { mp: 20 }, label: "Магия Фа" },
                    { text: "Бежать быстро, не оглядываясь", cost: { hp: 20 }, label: "Скорость" }
                ]
            },
            {
                id: 2, title: "Шепот Камышей",
                text: "В камышах вы находите раненого духа-хранителя. Он едва дышит. Поможете ему или сохраните ману?",
                prompt: "Anime illustration, mystical riverbank with tall golden reeds, a small glowing fairy-like spirit trapped in dark vines, soft evening light, detailed 2D backgrounds.",
                options: [
                    { text: "Поделиться искрой жизни", cost: { mp: 15, hp: 5 }, label: "Доброта" },
                    { text: "Оставить его (Слишком опасно)", cost: { hp: 0 }, label: "Прагматизм" }
                ]
            },
            {
                id: 3, title: "Врата Белогорья",
                text: "Горы встают стеной. Впереди — древние врата, запертые на музыкальный замок. Бермяш нашел символы, но они непонятны.",
                prompt: "Stunning anime art, massive ancient stone gates carved into a white mountain, runic symbols glowing golden, tiny heroes looking up in awe, cinematic scale, high fantasy anime style.",
                options: [
                    { text: "Импровизировать на флейте", cost: { mp: 25 }, label: "Интуиция" },
                    { text: "Искать рычаг в обломках", cost: { hp: 15 }, label: "Труд" }
                ]
            },
            {
                id: 4, title: "Лабиринт Эхо",
                text: "Внутри гор звук искажается. Каждое слово возвращается криком. Смерги чуют ваш голос.",
                prompt: "Intricate anime cave interior, crystalline walls reflecting light, purple shadows lurking in corners, eerie and beautiful, bioluminescent plants, 2D hand-drawn style.",
                options: [
                    { text: "Петь шепотом", cost: { mp: 10 }, label: "Тишина" },
                    { text: "Заткнуть уши и идти вперед", cost: { hp: 10 }, label: "Воля" }
                ]
            },
            {
                id: 5, title: "Мост Над Бездной",
                text: "Тонкий каменный мост качается над пустотой. Внизу — река забвения. Нужно равновесие.",
                prompt: "Anime landscape, a precarious stone bridge connecting two peaks, swirling dark clouds below, lightning in the distance, dramatic anime composition, vibrant colors.",
                options: [
                    { text: "Держаться за Бермяша", cost: { mp: 0 }, label: "Дружба" },
                    { text: "Использовать левитацию", cost: { mp: 30 }, label: "Высшая Магия" }
                ]
            },
            {
                id: 6, title: "Старый Престан",
                text: "Вы встречаете всадника на сове. Это Престан. Он ранен и просит передать весть в Мирин.",
                prompt: "Anime character design, an old warrior in wooden armor riding a giant fluffy owl, snowy forest background, soft sunlight filtering through trees, emotional anime scene.",
                options: [
                    { text: "Взять свиток", cost: { mp: 0 }, label: "Долг" },
                    { text: "Исцелить воина", cost: { mp: 40 }, label: "Милосердие" }
                ]
            },
            {
                id: 7, title: "Сад Забытых Снов",
                text: "Цветы здесь пахнут домом. Вы начинаете засыпать. Это ловушка Мага Яха.",
                prompt: "Magical anime garden, surreal oversized flowers with glowing pollen, pink and purple hues, a sense of drowsiness and beauty, dreamlike anime aesthetic.",
                options: [
                    { text: "Уколоть палец шипом (Проснуться)", cost: { hp: 15 }, label: "Боль" },
                    { text: "Сыграть резкую ноту", cost: { mp: 20 }, label: "Резонанс" }
                ]
            },
            {
                id: 8, title: "Окраина Мирина",
                text: "Град-терем в осаде. Тени карабкаются по стенам. Вам нужно пробраться внутрь незамеченными.",
                prompt: "Anime cityscape, ancient wooden Slavic fortress under attack by shadow monsters, chaotic magical fires, dark sky, epic scale, detailed architecture.",
                options: [
                    { text: "Использовать маскировку", cost: { mp: 25 }, label: "Хитрость" },
                    { text: "Пробиться с боем", cost: { hp: 35 }, label: "Героизм" }
                ]
            },
            {
                id: 9, title: "Тронный Зал",
                text: "Король дрёмов превращен в камень. Перед вами — зеркало Истины. Оно показывает ваш главный страх.",
                prompt: "Grand anime throne room, stone statues of kings, a massive ornate mirror glowing with white light, reflections of shadows, cinematic lighting, 2D masterpiece.",
                options: [
                    { text: "Разбить зеркало", cost: { hp: 20 }, label: "Гнев" },
                    { text: "Посмотреть в глаза страху", cost: { mp: 15 }, label: "Мудрость" }
                ]
            },
            {
                id: 10, title: "Библиотека Вед",
                text: "Здесь хранятся знания о Латаре. Чтобы прочесть их, нужно пожертвовать воспоминанием.",
                prompt: "Infinite anime library, scrolls floating in the air, golden dust motes, magical atmosphere, ancient and wise feeling, soft glow from books.",
                options: [
                    { text: "Отдать память о первой песне", cost: { mp: 0 }, label: "Жертва" },
                    { text: "Попробовать взломать печать", cost: { mp: 30 }, label: "Сила" }
                ]
            },
            {
                id: 11, title: "Кузница Духа",
                text: "Ваш артефакт поврежден. Нужно перековать его в пламени сердца. Бермяш готов помочь.",
                prompt: "Magical anime forge, blue and gold flames, a flute being tempered in magic, sparks like stars, intense and focused atmosphere, vibrant colors.",
                options: [
                    { text: "Вложить свою волю", cost: { hp: 25 }, label: "Закалка" },
                    { text: "Петь вместе с Бермяшем", cost: { mp: 20 }, label: "Единство" }
                ]
            },
            {
                id: 12, title: "Башня Мага Яха",
                text: "Вы на вершине. Маг Ях ждет вас. Он предлагает сделку: жизнь Бермяша в обмен на Флейту.",
                prompt: "Dark anime tower top, swirling dark magic portal, a tall shadowy villain with glowing eyes, dramatic clouds, final boss atmosphere.",
                options: [
                    { text: "Отказаться и атаковать", cost: { mp: 40 }, label: "Верность" },
                    { text: "Обмануть злодея", cost: { hp: 20, mp: 20 }, label: "Риск" }
                ]
            },
            {
                id: 13, title: "Последний Резонанс",
                text: "Магия Яха почти поглотила мир. Остался один аккорд. Вы должны сыграть его вместе.",
                prompt: "Epic anime finale, golden and purple magic clashing, two tiny heroes glowing with light, massive explosion of sparkles, emotional and powerful 2D art.",
                options: [
                    { text: "Песнь Лады Явь", cost: { mp: 50 }, label: "Свет" },
                    { text: "Крик Чарадора", cost: { hp: 50 }, label: "Ярость" }
                ]
            },
            {
                id: 14, title: "Рассвет",
                text: "Тьма рассеялась. Вы стоите на руинах башни, глядя на восходящее солнце. Мир спасен, но какой ценой?",
                prompt: "Peaceful anime landscape, sunrise over a green valley, blooming flowers where shadows were, two heroes sitting together, beautiful and calm Makoto Shinkai sky.",
                options: [
                    { text: "Вернуться в Дремуш", cost: { mp: 0 }, label: "Домой" }
                ]
            }
        ];

        const App = () => {
            const [scene, setScene] = useState('intro');
            const [step, setStep] = useState(0);
            const [stats, setStats] = useState({ hp: 100, mp: 100 });
            const [image, setImage] = useState(null);
            const [loadingImg, setLoadingImg] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const audioRef = useRef(null);
            const contentRef = useRef(null);
            const AUDIO_FILE = "Slow_Water_Over_Stone.mp3";

            const generateArt = async (prompt) => {
                const apiKey = ""; 
                if (!apiKey) return;
                setLoadingImg(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                    });
                    const data = await res.json();
                    if (data.predictions?.[0]?.bytesBase64Encoded) {
                        setImage(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (e) { console.error(e); }
                setLoadingImg(false);
            };

            useEffect(() => {
                if (scene === 'playing') {
                    generateArt(STORY_DATA[step].prompt);
                    if (contentRef.current) contentRef.current.scrollTo({top: 0, behavior: 'smooth'});
                }
            }, [step, scene]);

            const startPlaying = () => {
                setScene('playing');
                if (audioRef.current) audioRef.current.play().catch(() => {});
            };

            const handleOption = (opt) => {
                const newHp = Math.max(0, stats.hp - (opt.cost?.hp || 0));
                const newMp = Math.max(0, stats.mp - (opt.cost?.mp || 0));
                setStats({ hp: newHp, mp: newMp });
                
                if (newHp <= 0) setScene('gameover');
                else if (step + 1 < STORY_DATA.length) setStep(step + 1);
                else setScene('victory');
            };

            if (scene === 'intro') return (
                <div className="h-screen bg-[#080707] flex flex-col items-center justify-between p-12 text-center border-4 border-[#d4af37]/20 m-2 rounded-3xl overflow-hidden">
                    <div className="mt-12">
                        <div className="w-24 h-24 mx-auto mb-6 relative">
                            <Music className="w-full h-full text-amber-500 animate-pulse" />
                            <div className="absolute inset-0 bg-amber-500/20 blur-xl rounded-full"></div>
                        </div>
                        <h1 className="text-5xl font-bold tracking-tighter text-amber-50 uppercase mb-4" style={{fontFamily: 'Old Standard TT'}}>Чарадор</h1>
                        <p className="text-amber-600 text-xs uppercase tracking-[0.5em] italic">15 ступеней к свету</p>
                    </div>
                    <button onClick={startPlaying} className="w-full py-6 choice-btn rounded-2xl font-bold uppercase tracking-widest text-amber-100">
                        Начать легенду
                    </button>
                    <audio ref={audioRef} src={AUDIO_FILE} loop />
                </div>
            );

            if (scene === 'gameover') return (
                <div className="h-screen bg-black flex flex-col items-center justify-center p-8 text-center">
                    <Skull className="w-20 h-20 text-red-900 mb-6" />
                    <h2 className="text-4xl font-bold text-red-700 uppercase mb-4">Ваша мелодия утихла</h2>
                    <button onClick={() => window.location.reload()} className="px-10 py-4 border border-stone-800 rounded-full text-stone-400 uppercase text-xs">Попробовать снова</button>
                </div>
            );

            if (scene === 'victory') return (
                <div className="h-screen bg-[#080707] flex flex-col items-center justify-center p-8 text-center">
                    <Sparkles className="w-20 h-20 text-amber-500 mb-6" />
                    <h2 className="text-4xl font-bold text-amber-100 uppercase mb-4">Мир спасен</h2>
                    <p className="text-stone-400 mb-8 italic">Вы прошли через все испытания и вернули рассвет в Чарадор.</p>
                    <button onClick={() => window.location.reload()} className="px-10 py-4 border border-amber-600 rounded-full text-amber-500 uppercase text-xs">В начало</button>
                </div>
            );

            const current = STORY_DATA[step];

            return (
                <div className="game-container">
                    <div className="image-frame">
                        {loadingImg ? (
                            <div className="absolute inset-0 flex items-center justify-center bg-stone-950">
                                <div className="flex flex-col items-center gap-4">
                                    <div className="w-8 h-8 border-2 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
                                    <span className="text-[9px] uppercase tracking-[0.3em] text-amber-900">Видение Чарадора...</span>
                                </div>
                            </div>
                        ) : (
                            <img src={image || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000"} className="w-full h-full object-cover grayscale-[0.2]" alt="anime scene" />
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-[#120e0c] via-transparent to-black/30" />
                        
                        <div className="absolute top-6 left-4 right-4 flex justify-between items-start z-10">
                            <div className="flex flex-col gap-2 bg-black/40 p-2 rounded-lg backdrop-blur-sm border border-white/5">
                                <div className="flex items-center gap-2">
                                    <Heart className="w-3 h-3 text-red-500" />
                                    <div className="h-1 w-20 bg-stone-900 rounded-full overflow-hidden">
                                        <div className="h-full bg-red-600 transition-all duration-500" style={{width: `${stats.hp}%`}} />
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <Sparkles className="w-3 h-3 text-blue-500" />
                                    <div className="h-1 w-20 bg-stone-900 rounded-full overflow-hidden">
                                        <div className="h-full bg-blue-600 transition-all duration-500" style={{width: `${stats.mp}%`}} />
                                    </div>
                                </div>
                            </div>
                            <button onClick={() => { if(audioRef.current) audioRef.current.muted = !isMuted; setIsMuted(!isMuted); }} className="p-2 bg-black/60 rounded-lg border border-white/10">
                                {isMuted ? <VolumeX className="w-4 h-4 text-white" /> : <Volume2 className="w-4 h-4 text-white" />}
                            </button>
                        </div>
                        <div className="absolute bottom-2 right-4 text-[10px] text-amber-500/50 uppercase tracking-widest font-bold">
                            Сцена {step + 1} / {STORY_DATA.length}
                        </div>
                    </div>

                    <div className="content-area" ref={contentRef}>
                        <div className="ornament-border">
                            <CelticCorner className="celtic-corner top-0 left-0" />
                            <CelticCorner className="celtic-corner top-0 right-0 rotate-90" />
                            <CelticCorner className="celtic-corner bottom-0 left-0 -rotate-90" />
                            <CelticCorner className="celtic-corner bottom-0 right-0 rotate-180" />
                            
                            <div className="mb-4 text-center">
                                <span className="text-[10px] text-amber-600 font-bold uppercase tracking-[0.4em]">{current.title}</span>
                            </div>
                            
                            <p className="text-base leading-relaxed text-stone-200 italic font-serif text-center px-2 mb-8">
                                {current.text}
                            </p>

                            <div className="space-y-4 mt-auto">
                                {current.options.map((opt, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => handleOption(opt)}
                                        className="choice-btn p-5 rounded-xl text-left group"
                                    >
                                        <div className="flex items-center justify-between mb-1">
                                            <span className="text-[9px] text-amber-700 font-bold uppercase tracking-widest">{opt.label}</span>
                                            <ChevronRight className="w-3 h-3 text-amber-900 group-hover:text-amber-400 transition-colors" />
                                        </div>
                                        <div className="text-amber-50 text-sm group-hover:text-white transition-colors">{opt.text}</div>
                                        {opt.cost && (
                                            <div className="flex gap-4 mt-2 border-t border-white/5 pt-1">
                                                {opt.cost.hp > 0 && <span className="text-[9px] text-red-500/80 uppercase font-bold">Кровь: -{opt.cost.hp}</span>}
                                                {opt.cost.mp > 0 && <span className="text-[9px] text-blue-500/80 uppercase font-bold">Дух: -{opt.cost.mp}</span>}
                                            </div>
                                        )}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
